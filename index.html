<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>무대 서랍</title>
  <meta name="description" content="직접 고른 무대 영상과 직캠, 움짤을 날짜와 멤버로 펼쳐 보는 개인 아카이브">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='22' height='26' rx='3' fill='%233f444d'/%3E%3Crect x='3' y='8' width='6' height='9' rx='2' fill='%231a1b1e'/%3E%3Ccircle cx='11' cy='9' r='1.6' fill='%23e4e5e8'/%3E%3Ccircle cx='11' cy='16' r='1.6' fill='%23e4e5e8'/%3E%3Ccircle cx='11' cy='23' r='1.6' fill='%23e4e5e8'/%3E%3Crect x='15' y='8' width='9' height='13' rx='1.5' fill='%23fafafa'/%3E%3Crect x='15' y='18' width='9' height='3' fill='%23c2553f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { var t = localStorage.getItem('sd.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <a class="brand" href="#" id="brand">무대 서랍</a>
      <form class="search" role="search" id="search-form">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <label class="sr" for="q">전체 검색</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="유나 10.23, Paper Moon 세로…">
      </form>
      <button class="iconbtn" id="theme-btn" type="button" aria-label="다크 모드로 전환"></button>
      <a class="btn" id="add-btn" href="admin.html">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>관리
      </a>
    </div>
    <nav class="tabs" id="tabs" aria-label="그룹"></nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="overlay-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">이 사이트는 자바스크립트가 필요해요.</p></noscript>
  <script>
    // file://로 열면 모듈 스크립트와 데이터 읽기가 막힌다. 해결 방법을 바로 보여 준다.
    if (location.protocol === 'file:') {
      document.getElementById('main').innerHTML = '<div class="state" role="alert"><h2>파일을 직접 열어서 데이터를 못 읽었어요</h2>'
        + '<p>브라우저는 <code>file://</code>로 연 페이지에서 모듈 스크립트와 <code>data/videos.json</code>을 읽지 못하게 막아요. 저장소 폴더에서 <code>python3 -m http.server</code>를 실행하고 <code>http://localhost:8000</code>으로 여세요.</p></div>';
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
