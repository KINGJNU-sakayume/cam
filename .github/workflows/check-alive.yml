name: check-alive

on:
  schedule:
    - cron: '17 3 * * 1' # 매주 월요일 12:17 (KST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-alive
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 유튜브 영상 생존 확인
        run: node scripts/check-alive.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
