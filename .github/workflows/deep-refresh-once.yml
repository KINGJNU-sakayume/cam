name: Deep refresh by group (one-off)
on:
  push:
    branches:
      - data/refresh-2026-11-04
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cam-deep-refresh
  cancel-in-progress: false

jobs:
  harvest:
    name: Deep search ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [g1, g2, g3, g4, g5, g6, g7, g8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Find performances, including member-by-member deep search
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          # Use the original main branch's last event (minus three days),
          # not the date of the newly added shallow-search videos.
          case "$GROUP" in
            g1) FROM=2026-10-21 ;;
            g2) FROM=2026-10-21 ;;
            g3) FROM=2026-10-16 ;;
            g4) FROM=2026-10-20 ;;
            g5) FROM=2026-10-08 ;;
            g6) FROM=2026-10-19 ;;
            g7) FROM=2026-10-01 ;;
            g8) FROM=2026-10-22 ;;
          esac
          echo "Deep-search $GROUP: $FROM to 2026-11-04"
          node scripts/harvest.mjs "$FROM" 2026-11-04 --group "$GROUP" --deep --jobs 4
      - name: Preserve this group's results and manual-review candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-${{ matrix.group }}
          path: .cache/harvest/
          retention-days: 30
          if-no-files-found: warn

  consolidate:
    name: Consolidate, validate and update PR #36
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download each group's independent results
        uses: actions/download-artifact@v4
        with:
          pattern: deep-*
          path: .cache/deep-results
      - name: Deduplicate and combine safe candidates
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync, readdirSync, mkdirSync, existsSync } from 'node:fs';
          import { join } from 'node:path';
          const base='.cache/deep-results';
          const ids=['g1','g2','g3','g4','g5','g6','g7','g8'];
          const groupNames={g1:'IVE',g2:'NMIXX',g3:'fromis_9',g4:'Hearts2Hearts',g5:'aespa',g6:'tripleS',g7:'ITZY',g8:'BABYMONSTER'};
          const have=new Set(JSON.parse(readFileSync('data/videos.json','utf8')).videos.map(v=>v.ytId));
          const used=new Set();
          const videos=[];
          const summary=['# Groupwise --deep search', '', '| Group | Unique safe candidates | Pending review |', '|---|---:|---:|'];
          const missing=[];
          for(const g of ids) {
            const p=join(base,'deep-'+g);
            const path=join(p,'auto.json');
            if(!existsSync(path)){missing.push(g);summary.push('| '+groupNames[g]+' | INCOMPLETE | INCOMPLETE |');continue}
            const found=JSON.parse(readFileSync(path,'utf8')).videos;
            for(const v of found) {
              const id=new URL(v.url).pathname.split('/').pop();
              if(!have.has(id)&&!used.has(id)){used.add(id);videos.push(v)}
            }
            const reviewPath=join(p,'review.json');
            const pending=existsSync(reviewPath)?JSON.parse(readFileSync(reviewPath,'utf8')).videos.length:'?';
            summary.push('| '+groupNames[g]+' | '+found.length+' | '+pending+' |');
          }
          mkdirSync('.cache/deep-merged',{recursive:true});
          writeFileSync('.cache/deep-merged/auto.json',JSON.stringify({videos},null,2)+'\n');
          summary.push('', 'Combined unique new safe candidates: '+videos.length,'Incomplete groups: '+(missing.join(', ')||'none'));
          writeFileSync('.cache/deep-merged/summary.md',summary.join('\n')+'\n');
          console.log(summary.join('\n'));
          JS
      - name: Dry-run new videos
        run: |
          if node --input-type=module -e "import{readFileSync}from'node:fs';process.exit(JSON.parse(readFileSync('.cache/deep-merged/auto.json','utf8')).videos.length?0:1)"; then
            node scripts/archive.mjs add .cache/deep-merged/auto.json --create-songs --skip-invalid --no-fetch --dry-run > .cache/deep-merged/dry-run.log 2>&1
            node scripts/archive.mjs add .cache/deep-merged/auto.json --create-songs --skip-invalid --no-fetch > .cache/deep-merged/add.log 2>&1
            tail -n 45 .cache/deep-merged/add.log
          else
            echo "No additional unambiguous videos"
          fi
      - name: Validate all video references
        run: |
          node scripts/archive.mjs validate
          node scripts/test-parse.mjs
      - name: Report group-by-group findings
        if: always()
        run: |
          cat .cache/deep-merged/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          echo '## Total archive videos by group' >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('data/videos.json','utf8'));
          const eventGroup=new Map(d.events.map(e=>[e.id,e.groupId]));
          for(const g of d.groups)
            console.log('- '+g.name+': '+d.videos.filter(v=>eventGroup.get(v.eventId)===g.id).length+' videos');
          JS
      - name: Commit data and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git rm .github/workflows/deep-refresh-once.yml
          git commit -m "담기: 8개 그룹별 --deep 최신 영상 검색 및 추가"
          git push origin HEAD:data/refresh-2026-11-04
      - name: Upload combined review and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-consolidated-review
          path: |
            .cache/deep-merged/
            .cache/deep-results/*/review.txt
            .cache/deep-results/*/summary.txt
          retention-days: 30
          if-no-files-found: warn
