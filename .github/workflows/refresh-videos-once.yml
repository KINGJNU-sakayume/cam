name: Refresh stage videos (one-off)
on:
  push:
    branches:
      - data/refresh-2026-11-04
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Seed group-specific checkpoints from existing events
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          const d = JSON.parse(readFileSync('data/videos.json','utf8'));
          const state = Object.fromEntries(d.groups.map(g => [
            g.id, d.events.filter(e=>e.groupId===g.id).map(e=>e.date).sort().at(-1) || '2026-10-20'
          ]));
          mkdirSync('.cache',{recursive:true});
          writeFileSync('.cache/harvest-state.json', JSON.stringify(state,null,2));
          console.log('Starting checkpoints',state);
          JS
      - name: Discover recent videos for all groups (bounded search)
        run: node scripts/harvest.mjs --since-last --jobs 6
      - name: Add unambiguous new videos with existing archive parser
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('.cache/harvest/auto.json','utf8'));
          console.log('Unambiguous candidate videos:',d.videos.length);
          JS
          if node --input-type=module -e "import{readFileSync}from'node:fs';process.exit(JSON.parse(readFileSync('.cache/harvest/auto.json')).videos.length?0:1)"; then
            node scripts/archive.mjs add .cache/harvest/auto.json --create-songs --skip-invalid --no-fetch --dry-run > .cache/harvest/dry-run.txt
            node scripts/archive.mjs add .cache/harvest/auto.json --create-songs --skip-invalid --no-fetch
          else
            echo "No unambiguous new videos were found"
          fi
      - name: Validate repository data
        run: |
          node scripts/archive.mjs validate
          node scripts/test-parse.mjs
      - name: Summary
        if: always()
        run: |
          echo '## Harvest summary' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .cache/harvest/summary.txt ]; then
            cat .cache/harvest/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '### Per-group coverage' >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import{readFileSync}from'node:fs';
          const d=JSON.parse(readFileSync('data/videos.json','utf8'));
          for(const g of d.groups) {
            const es=d.events.filter(e=>e.groupId===g.id);
            const dates=es.map(e=>e.date).sort();
            console.log('- '+g.name+': '+d.videos.filter(v=>es.some(e=>e.id===v.eventId)).length+' videos; last stage '+(dates.at(-1)||'none'));
          }
          JS
      - name: Commit validated video data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if ! git diff --cached --quiet; then
            git commit -m "담기: 2026-11-04 기준 전 그룹 최신 무대 검색 반영"
            git push origin HEAD:data/refresh-2026-11-04
          else
            echo "No new videos to commit"
          fi
      - name: Open review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '전 그룹의 기존 마지막 공연 날짜에서 3일 전부터 2026-11-04까지 YouTube 검색 결과를 확인했습니다.'
            echo
            echo '자동 분류가 확실한 영상만 저장했으며 유튜브 ID 중복을 배제했습니다.'
            echo
            echo '검증: scripts/archive.mjs validate + test-parse 통과.'
            echo
            echo '### 검색 결과'
            cat .cache/harvest/summary.txt
            echo
            echo '정확한 날짜/멤버/곡 판단이 필요한 항목은 자동 추가하지 않았습니다. Actions 실행 요약과 검토 목록을 확인하세요.'
          } > /tmp/pr_body.md
          gh pr create --base main --head data/refresh-2026-11-04 --title "담기: 8개 그룹 최신 무대 업데이트 (2026-11-04)" --body-file /tmp/pr_body.md || echo "PR creation unavailable; create PR from GitHub branch if needed"
      - name: Upload review candidates for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-harvest-review
          path: |
            .cache/harvest/review.txt
            .cache/harvest/summary.txt
            .cache/harvest/dry-run.txt
          if-no-files-found: ignore
